[project]
name = "telegram-channel-manager-bot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Alex Chernyshov", email = "alexfoxalt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langsmith>=0.12.2",
    "loguru>=0.7.3",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
]

[project.scripts]
telegram-channel-manager-bot = "telegram_channel_manager_bot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 120
